# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml
esp32:
  variant: esp32s3
  framework:
    type: esp-idf

web_server:
  css_url: midea

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    gateway: 192.168.100.1
    static_ip: 192.168.100.65
    subnet: 255.255.255.0
  ap:
    ssid: MIDEA TEST1 Fallback Hotspot
    password: "hoClBTCy7FBD"

substitutions:
  devicename: heatpump
  description: Heatpump Controller
  entity_prefix: Heatpump

globals:
  - id: unmasked_value_water_temperature_t1s
    type: int
    restore_value: no
    initial_value: '0'
  - id: unmasked_curve_selection
    type: int
    restore_value: no
    initial_value: '0'

esphome:
  name: "${devicename}"
  comment: "${description}"
  friendly_name: "${description}"

logger:
  level: INFO
  baud_rate: 0

captive_portal:

uart:
  id: modbus_uart
  tx_pin: GPIO43  
  rx_pin: GPIO44
  baud_rate: 9600
  stop_bits: 1
  data_bits: 8
  parity: NONE

modbus:
  flow_control_pin: 5
  id: heatpump_modbus

modbus_controller:
  - id: "${devicename}"
    address: 0x1
    modbus_id: heatpump_modbus
    setup_priority: -10
    update_interval: 10s

# ==============================================================================
# SEKCJA TEXT_SENSOR (Status tekstowy pompy)
# ==============================================================================
text_sensor:
  - platform: template
    name: "${entity_prefix} status pracy"
    id: "${devicename}_operating_mode_text"
    icon: "mdi:state-machine"
    lambda: |-
      int mode = (int)id(${devicename}_operating_mode).state;
      switch (mode) {
        case 0: return {"Wyłączony / Czuwanie"};
        case 2: return {"Chłodzenie"};
        case 3: return {"Grzanie"};
        case 4: return {"CWU (Woda użytkowa)"};
        default: return {"Tryb (" + to_string(mode) + ")"};
      }
    update_interval: 10s

# ==============================================================================
# SEKCJA SENSOR (Wszystkie sensory liczbowe)
# ==============================================================================
sensor:
  # --- DIAGNOSTYKA ---
  - platform: uptime
    name: "${entity_prefix} Uptime"

  # --- MOC ELEKTRYCZNA, GRZEWCZA I COP ---
  - platform: template
    name: "${entity_prefix} Aktualny Pobor Mocy"
    id: hp_power_w
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      float v = id(${devicename}_outdoor_unit_voltage).state;
      float a = id(${devicename}_outdoor_unit_current).state;
      if (isnan(v) || isnan(a)) return 0.0;
      return v * a * 0.95;

  - platform: template
    name: "${entity_prefix} Moc Grzewcza"
    id: hp_thermal_power_w
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      float t_out = id(${devicename}_water_outlet_temperature).state;
      float t_in = id(${devicename}_water_inlet_temperature).state;
      float flow = id(${devicename}_water_flow).state;
      if (isnan(t_out) || isnan(t_in)) return 0.0;
      if (isnan(flow) || !(flow > 0.0)) flow = 1.8;
      float delta_t = t_out - t_in;
      if (!(delta_t > 0.0)) return 0.0;
      return flow * 1.163 * delta_t * 1000.0;

  - platform: template
    name: "${entity_prefix} Aktualny COP"
    id: hp_cop
    unit_of_measurement: "COP"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      float p_el = id(hp_power_w).state;
      float p_th = id(hp_thermal_power_w).state;
      if (isnan(p_el) || !(p_el > 50.0) || isnan(p_th) || !(p_th > 0.0)) return 0.0;
      float cop = p_th / p_el;
      if (cop > 8.0) return 8.0;
      return cop;

  # --- LICZNIK CZASU PRACY ---
  - platform: template
    id: "${devicename}_is_working"
    internal: true
    lambda: |-
      if (id(${devicename}_operating_mode).state > 0) {
        return 1.0;
      } else {
        return 0.0;
      }
    update_interval: 10s

  - platform: integration
    name: "${entity_prefix} czas pracy"
    id: "${devicename}_working_hours"
    sensor: "${devicename}_is_working"
    time_unit: h
    restore: true
    unit_of_measurement: "h"
    accuracy_decimals: 2
    device_class: duration
    state_class: total_increasing

  # --- REJESTRY MODBUS ---
  # Register: 4
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} USTAWIONA temperatura wody w zbiorniku"
    id: "${devicename}_dhw_tank_temperature_t5s"
    register_type: holding
    address: 0x4
    value_type: S_WORD
    unit_of_measurement: "°C"

  # Register: 100
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} Czestotliwosc operacyjna kompresora"
    id: "${devicename}_compressor_operating_frequency"
    register_type: holding
    address: 0x64
    value_type: U_WORD
    unit_of_measurement: Hz

  # Register: 101
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} status pracy kod"
    id: "${devicename}_operating_mode"
    register_type: holding
    address: 0x65
    value_type: U_WORD

  # Register: 102
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} predkosc wentylatora"
    id: "${devicename}_fan_speed"
    register_type: holding
    address: 0x66
    unit_of_measurement: "r/min"
    value_type: U_WORD
    icon: mdi:fan

  # Register: 103
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} PMV otwarcia"
    id: "${devicename}_pmv_openness"
    register_type: holding
    address: 0x67
    value_type: U_WORD
    unit_of_measurement: "Pa"

  # Register: 104
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} Temperatura wody wlotowej"
    id: "${devicename}_water_inlet_temperature"
    register_type: holding
    address: 0x68
    value_type: S_WORD
    unit_of_measurement: "°C"

  # Register: 105
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} Temperatura wody wylotowej"
    id: "${devicename}_water_outlet_temperature"
    register_type: holding
    address: 0x69
    value_type: S_WORD
    unit_of_measurement: "°C"

  # Register: 107
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} Zewnetrzna temperatura"
    id: "${devicename}_outdoor_ambient_temperature"
    register_type: holding
    address: 0x6B
    unit_of_measurement: "°C"
    value_type: S_WORD

  # Register: 110
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} Pelna temperatura powrotu wody T1"
    id: "${devicename}_total_water_outlet_temperature_t1"
    register_type: holding
    address: 0x6e
    value_type: S_WORD
    unit_of_measurement: "°C"

  # Register: 111
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} system_całkowita_temperatura_wody_wylotowej_t1b"
    id: "${devicename}_system_total_water_outlet_temperature_t1b"
    register_type: holding
    address: 0x6f
    value_type: S_WORD
    unit_of_measurement: "°C"

  # Register: 114
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} Temperatura w pomieszczeniu Ta"
    id: "${devicename}_room_temperature_ta"
    register_type: holding
    address: 0x72
    value_type: S_WORD
    unit_of_measurement: "°C"

  # Register: 115
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} Temperatura wody w bojlerze cwu T5"
    id: "${devicename}_water_tank_temperature_t5"
    register_type: holding
    address: 0x73
    unit_of_measurement: "°C"
    value_type: S_WORD
    icon: mdi:thermometer-water

  # Register: 116
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} zewnetrzny pomiar wysokiego cisnienia"
    id: "${devicename}_outdoor_unit_high_pressure"
    register_type: holding
    address: 0x74
    value_type: U_WORD
    unit_of_measurement: kPA

  # Register: 117
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} zewnetrzny pomiar niskiego cisnienia"
    id: "${devicename}_outdoor_unit_low_pressure"
    register_type: holding
    address: 0x75
    value_type: U_WORD
    unit_of_measurement: kPA

  # Register: 118 (Wymagany do obliczania mocy)
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} zewnetrzny pomiar pradu"
    id: "${devicename}_outdoor_unit_current"
    register_type: holding
    address: 0x76
    value_type: U_WORD
    unit_of_measurement: A

  # Register: 119 (Wymagany do obliczania mocy)
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} zewnetrzny pomiar napiecia"
    id: "${devicename}_outdoor_unit_voltage"
    register_type: holding
    address: 0x77
    value_type: U_WORD
    unit_of_measurement: V

  # Register: 138 (Wymagany do obliczania mocy grzewczej i COP)
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "${entity_prefix} Przeplyw wody"
    id: "${devicename}_water_flow"
    register_type: holding
    address: 0x8A
    value_type: U_WORD
    unit_of_measurement: "m³/h"
    filters:
      - multiply: 0.01
