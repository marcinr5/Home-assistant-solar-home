# Board: Generic ESP32-S3 Board (Generic)
esp32:
  variant: esp32s3
  framework:
    type: esp-idf

web_server:
  port: 80

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    gateway: 192.168.100.1
    static_ip: 192.168.100.65
    subnet: 255.255.255.0
  ap:
    ssid: MIDEA TEST1 Fallback Hotspot
    password: "hoClBTCy7FBD"

globals:
  - id: unmasked_value_water_temperature_t1s
    type: int
    restore_value: no
    initial_value: '0'
  - id: unmasked_curve_selection
    type: int
    restore_value: no
    initial_value: '0'
  - id: compressor_starts_count
    type: int
    restore_value: yes
    initial_value: '0'
  - id: compressor_stops_count
    type: int
    restore_value: yes
    initial_value: '0'
  - id: defrost_count
    type: int
    restore_value: yes
    initial_value: '0'

esphome:
  name: heatpump
  comment: Heatpump Controller
  friendly_name: Heatpump Controller

logger:
  level: INFO
  baud_rate: 0

captive_portal:

uart:
  id: modbus_uart
  tx_pin: GPIO43  
  rx_pin: GPIO44
  baud_rate: 9600
  stop_bits: 1
  data_bits: 8
  parity: NONE

modbus:
  flow_control_pin: 5
  id: heatpump_modbus

modbus_controller:
  - id: heatpump
    address: 0x1
    modbus_id: heatpump_modbus
    setup_priority: -10
    update_interval: 10s

binary_sensor:
  - platform: template
    name: "Heatpump Stan sprezarki"
    id: heatpump_compressor_running
    device_class: running
    lambda: |-
      return id(heatpump_compressor_operating_frequency).state > 0.0;
    on_press:
      - lambda: |-
          id(compressor_starts_count) += 1;
    on_release:
      - lambda: |-
          id(compressor_stops_count) += 1;

  # Register: 128 (0x80) - Bit 1 (0x02) oznacza aktywny Defrost w Midea
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump Defrost"
    id: heatpump_defrost_active
    register_type: holding
    address: 0x80
    bitmask: 0x02
    icon: "mdi:snowflake-melt"
    on_press:
      - lambda: |-
          id(defrost_count) += 1;

text_sensor:
  - platform: template
    name: "Heatpump status pracy"
    id: heatpump_operating_mode_text
    icon: "mdi:state-machine"
    lambda: |-
      if (id(heatpump_defrost_active).state) {
        return {"Odszranianie (Defrost)"};
      }
      int mode = (int)id(heatpump_operating_mode).state;
      switch (mode) {
        case 0: return {"Wylaczony / Czuwanie"};
        case 2: return {"Chlodzenie"};
        case 3: return {"Grzanie"};
        case 4: return {"CWU (Woda uzytkowa)"};
        default: return {"Tryb (" + to_string(mode) + ")"};
      }
    update_interval: 10s

sensor:
  - platform: uptime
    name: "Heatpump Uptime"

  - platform: template
    name: "Heatpump Liczba wlaczen sprezarki"
    id: heatpump_compressor_starts
    icon: "mdi:engine"
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(compressor_starts_count);

  - platform: template
    name: "Heatpump Liczba wylaczen sprezarki"
    id: heatpump_compressor_stops
    icon: "mdi:engine-off"
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(compressor_stops_count);

  - platform: template
    name: "Heatpump Liczba cykli Defrost"
    id: heatpump_defrost_counter
    icon: "mdi:snowflake-alert"
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(defrost_count);

  - platform: template
    id: heatpump_is_defrosting
    internal: true
    lambda: |-
      return id(heatpump_defrost_active).state ? 1.0 : 0.0;
    update_interval: 10s

  - platform: integration
    name: "Heatpump czas Defrost"
    id: heatpump_defrost_hours
    sensor: heatpump_is_defrosting
    time_unit: h
    restore: true
    unit_of_measurement: "h"
    accuracy_decimals: 2
    device_class: duration
    state_class: total_increasing
  - platform: template
    name: "Heatpump Aktualny Pobor Mocy"
    id: hp_power_w
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      float v = id(heatpump_outdoor_unit_voltage).state;
      float a = id(heatpump_outdoor_unit_current).state;
      if (isnan(v) || isnan(a)) return 0.0;
      return v * a * 0.95;

  - platform: template
    name: "Heatpump Moc Grzewcza"
    id: hp_thermal_power_w
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      float t_out = id(heatpump_water_outlet_temperature).state;
      float t_in = id(heatpump_water_inlet_temperature).state;
      float flow = id(heatpump_water_flow).state;
      if (isnan(t_out) || isnan(t_in)) return 0.0;
      if (isnan(flow) || !(flow > 0.0)) flow = 1.8;
      float delta_t = t_out - t_in;
      if (!(delta_t > 0.0)) return 0.0;
      return flow * 1.163 * delta_t * 1000.0;

  - platform: template
    name: "Heatpump Aktualny COP"
    id: hp_cop
    unit_of_measurement: "COP"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      float p_el = id(hp_power_w).state;
      float p_th = id(hp_thermal_power_w).state;
      if (isnan(p_el) || !(p_el > 50.0) || isnan(p_th) || !(p_th > 0.0)) return 0.0;
      float cop = p_th / p_el;
      if (cop > 8.0) return 8.0;
      return cop;

  - platform: template
    id: heatpump_is_working
    internal: true
    lambda: |-
      if (id(heatpump_operating_mode).state > 0) {
        return 1.0;
      } else {
        return 0.0;
      }
    update_interval: 10s

  - platform: integration
    name: "Heatpump czas pracy"
    id: heatpump_working_hours
    sensor: heatpump_is_working
    time_unit: h
    restore: true
    unit_of_measurement: "h"
    accuracy_decimals: 2
    device_class: duration
    state_class: total_increasing

  # Register: 4
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump USTAWIONA temperatura wody w zbiorniku"
    id: heatpump_dhw_tank_temperature_t5s
    register_type: holding
    address: 0x4
    value_type: S_WORD
    unit_of_measurement: "°C"

  # Register: 100
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump Czestotliwosc operacyjna kompresora"
    id: heatpump_compressor_operating_frequency
    register_type: holding
    address: 0x64
    value_type: U_WORD
    unit_of_measurement: Hz

  # Register: 101
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump status pracy kod"
    id: heatpump_operating_mode
    register_type: holding
    address: 0x65
    value_type: U_WORD

  # Register: 102
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump predkosc wentylatora"
    id: heatpump_fan_speed
    register_type: holding
    address: 0x66
    unit_of_measurement: "r/min"
    value_type: U_WORD
    icon: mdi:fan

  # Register: 103
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump PMV otwarcia"
    id: heatpump_pmv_openness
    register_type: holding
    address: 0x67
    value_type: U_WORD
    unit_of_measurement: "Pa"

  # Register: 104
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump Temperatura wody wlotowej"
    id: heatpump_water_inlet_temperature
    register_type: holding
    address: 0x68
    value_type: S_WORD
    unit_of_measurement: "°C"

  # Register: 105
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump Temperatura wody wylotowej"
    id: heatpump_water_outlet_temperature
    register_type: holding
    address: 0x69
    value_type: S_WORD
    unit_of_measurement: "°C"

  # Register: 107
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump Zewnetrzna temperatura"
    id: heatpump_outdoor_ambient_temperature
    register_type: holding
    address: 0x6B
    unit_of_measurement: "°C"
    value_type: S_WORD

  # Register: 110
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump Pelna temperatura powrotu wody T1"
    id: heatpump_total_water_outlet_temperature_t1
    register_type: holding
    address: 0x6e
    value_type: S_WORD
    unit_of_measurement: "°C"

  # Register: 111
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump system_calkowita_temperatura_wody_wylotowej_t1b"
    id: heatpump_system_total_water_outlet_temperature_t1b
    register_type: holding
    address: 0x6f
    value_type: S_WORD
    unit_of_measurement: "°C"

  # Register: 114
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump Temperatura w pomieszczeniu Ta"
    id: heatpump_room_temperature_ta
    register_type: holding
    address: 0x72
    value_type: S_WORD
    unit_of_measurement: "°C"

  # Register: 115
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump Temperatura wody w bojlerze cwu T5"
    id: heatpump_water_tank_temperature_t5
    register_type: holding
    address: 0x73
    unit_of_measurement: "°C"
    value_type: S_WORD
    icon: mdi:thermometer-water

  # Register: 116
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump zewnetrzny pomiar wysokiego cisnienia"
    id: heatpump_outdoor_unit_high_pressure
    register_type: holding
    address: 0x74
    value_type: U_WORD
    unit_of_measurement: kPA

  # Register: 117
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump zewnetrzny pomiar niskiego cisnienia"
    id: heatpump_outdoor_unit_low_pressure
    register_type: holding
    address: 0x75
    value_type: U_WORD
    unit_of_measurement: kPA

  # Register: 118
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump zewnetrzny pomiar pradu"
    id: heatpump_outdoor_unit_current
    register_type: holding
    address: 0x76
    value_type: U_WORD
    unit_of_measurement: A

  # Register: 119
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump zewnetrzny pomiar napiecia"
    id: heatpump_outdoor_unit_voltage
    register_type: holding
    address: 0x77
    value_type: U_WORD
    unit_of_measurement: V

  # Register: 138
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: "Heatpump Przeplyw wody"
    id: heatpump_water_flow
    register_type: holding
    address: 0x8A
    value_type: U_WORD
    unit_of_measurement: "m³/h"
    filters:
      - multiply: 0.01
