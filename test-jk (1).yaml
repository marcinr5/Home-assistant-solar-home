esphome:
  name: magazyn-jk-bms-esp8266
  friendly_name: "Magazyn JK BMS ESP8266"

esp8266:
  board: nodemcuv2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    gateway: 192.168.100.1
    static_ip: 192.168.100.150
    subnet: 255.255.255.0
api:

web_server:
  port: 80
  version: 1

logger:
  baud_rate: 0
  level: DEBUG

uart:
  - id: uart_jk
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 115200
    rx_buffer_size: 384

external_components:
  - source: github://syssi/esphome-jk-bms@main

jk_modbus:
  - id: modbus_jk
    uart_id: uart_jk
    rx_timeout: 50ms

jk_bms:
  - id: jk_bms_bateria
    jk_modbus_id: modbus_jk
    update_interval: 5s

sensor:
  - platform: jk_bms
    jk_bms_id: jk_bms_bateria
    total_voltage:
      name: "JK Total Voltage"
    current:
      name: "JK Current"
    capacity_remaining:
      name: "JK Capacity Remaining"
    state_of_charge:
      name: "JK State of Charge"
    temperature_sensor_1:
      name: "JK Temperature 1"
    temperature_sensor_2:
      name: "JK Temperature 2"
    mosfet_temperature:
      name: "JK Mosfet Temperature"

text_sensor:
  - platform: jk_bms
    jk_bms_id: jk_bms_bateria
    errors:
      name: "JK BMS Errors"
